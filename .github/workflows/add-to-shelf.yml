name: Add to Reading Shelf

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the article/book/paper to add"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-item:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch metadata and append to shelf.json
        env:
          ITEM_URL: ${{ github.event.inputs.url }}
          IFRAMELY_API_KEY: ${{ secrets.IFRAMELY_API_KEY }}
        run: |
          set -ex
          ENC=$(jq -rn --arg u "$ITEM_URL" '$u|@uri')
          RESPONSE=$(curl -s "https://iframe.ly/api/iframely?url=$ENC&api_key=$IFRAMELY_API_KEY")

          TITLE=$(echo "$RESPONSE" | jq -r '.meta.title // empty')
          if [ -z "$TITLE" ]; then
            echo "Iframely didn't return a title for $ITEM_URL. Response:"
            echo "$RESPONSE"
            exit 1
          fi

          DESC=$(echo "$RESPONSE" | jq -r '.meta.description // ""')
          SITE=$(echo "$RESPONSE" | jq -r '.meta.site // empty')
          if [ -z "$SITE" ]; then
            SITE=$(echo "$ITEM_URL" | awk -F/ '{print $3}')
          fi
          IMAGE=$(echo "$RESPONSE" | jq -r '.links.thumbnail[0].href // ""')
          DATE_ADDED=$(date +%Y-%m-%d)

          NEW_ITEM=$(jq -n \
            --arg url "$ITEM_URL" \
            --arg title "$TITLE" \
            --arg description "$DESC" \
            --arg image "$IMAGE" \
            --arg siteName "$SITE" \
            --arg dateAdded "$DATE_ADDED" \
            '{url:$url, title:$title, description:$description, image:$image, siteName:$siteName, dateAdded:$dateAdded}')

          jq --argjson item "$NEW_ITEM" '. + [$item]' data/shelf.json > data/shelf.tmp.json
          mv data/shelf.tmp.json data/shelf.json

          echo "Added: $TITLE ($SITE)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shelf.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add to reading shelf: ${{ github.event.inputs.url }}"
          git push
