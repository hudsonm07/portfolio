name: Add to Reading Shelf

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the article/book/paper to add"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-item:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Open Graph metadata and append to shelf.json
        env:
          ITEM_URL: ${{ github.event.inputs.url }}
        run: |
          set -e

          HTML=$(curl -sL --max-time 15 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" "$ITEM_URL")

          get_meta() {
            echo "$HTML" | grep -ioP "<meta[^>]+(property|name)=[\"']$1[\"'][^>]+content=[\"']\K[^\"']*" | head -1
          }

          decode() {
            sed -e 's/&amp;/\&/g' -e 's/&quot;/"/g' -e "s/&#39;/'/g" -e "s/&apos;/'/g" -e 's/&lt;/</g' -e 's/&gt;/>/g'
          }

          TITLE=$(get_meta "og:title")
          [ -z "$TITLE" ] && TITLE=$(get_meta "twitter:title")
          [ -z "$TITLE" ] && TITLE=$(echo "$HTML" | grep -ioP '<title>\K[^<]*' | head -1)
          TITLE=$(echo "$TITLE" | decode)

          if [ -z "$TITLE" ]; then
            echo "Couldn't find a title for $ITEM_URL - the page may block automated requests or have no metadata."
            exit 1
          fi

          DESC=$(get_meta "og:description")
          [ -z "$DESC" ] && DESC=$(get_meta "description")
          DESC=$(echo "$DESC" | decode)

          IMAGE=$(get_meta "og:image")
          [ -z "$IMAGE" ] && IMAGE=$(get_meta "twitter:image")
          IMAGE=$(echo "$IMAGE" | decode)

          SITE=$(get_meta "og:site_name" | decode)
          if [ -z "$SITE" ]; then
            SITE=$(echo "$ITEM_URL" | awk -F/ '{print $3}')
          fi

          DATE_ADDED=$(date +%Y-%m-%d)

          NEW_ITEM=$(jq -n \
            --arg url "$ITEM_URL" \
            --arg title "$TITLE" \
            --arg description "$DESC" \
            --arg image "$IMAGE" \
            --arg siteName "$SITE" \
            --arg dateAdded "$DATE_ADDED" \
            '{url:$url, title:$title, description:$description, image:$image, siteName:$siteName, dateAdded:$dateAdded}')

          jq --argjson item "$NEW_ITEM" '. + [$item]' data/shelf.json > data/shelf.tmp.json
          mv data/shelf.tmp.json data/shelf.json

          echo "Added: $TITLE ($SITE)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shelf.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add to reading shelf: ${{ github.event.inputs.url }}"
          git push
