<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks - Firstname Lastname</title>
<meta name="robots" content="noindex">
<script>
  (function () {
    var stored = localStorage.getItem("theme");
    var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .thanks-wrap {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 64px 0;
  }

  .thanks-title {
    font-family: var(--font-heading);
    font-size: 2.25rem;
    font-weight: 600;
    letter-spacing: -0.025em;
    margin: 0 0 12px;
  }

  .thanks-text {
    font-size: 18px;
    line-height: 1.7;
    color: var(--text-muted);
    max-width: 50ch;
    margin: 0 0 28px;
  }
</style>
</head>
<body>

<div class="page-frame">
  <main>
    <div class="thanks-wrap">
      <h1 class="thanks-title">Message sent</h1>
      <p class="thanks-text">Thanks for reaching out - I read every message and will get back to you soon.</p>
      <a class="btn btn-outline" href="index.html#contact">Back to site</a>
    </div>
  </main>
</div>

</body>
</html>
